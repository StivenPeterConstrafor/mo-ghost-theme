# Pagination-safe: /author/x/page/2 used to be rewritten to
# /tag/author-x//page/2, which 404s. Anything after the slug is dropped
# and the reader lands on page 1.
- from: ^/author/([^/]+)(/.*)?$
  to: /tag/author-$1/
  permanent: true

# ── Import duplicates (SEO audit M9, 2026-09-23) ────────────────────
# The HubSpot import created 13 posts twice, the second copy under a -2
