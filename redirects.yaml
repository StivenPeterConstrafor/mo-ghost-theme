# Ghost URL redirects for Mere Orthodoxy.
#
# Ghost treats redirects.yaml as site config, not theme content, so it
# is NOT included in theme deploys. Upload once via Ghost Admin ->
# Settings -> Labs -> Redirects -> Upload redirects file. Re-upload only
# when redirects change.
#
# THIS FILE IS NOT THE FILE GHOST ACCEPTS. Ghost's YAML parser wants a
# map keyed by status code:
#
#   301:
#     '^/from/?$': '/to/'
#   302:
#     '^/other/?$': '/elsewhere/'
#
# It rejects this list-of-objects form outright ("YAML input is
# invalid"), which is how 2026-09-23's upload failed the first time.
# This stays the source of truth because it holds the reasoning; convert
# before uploading, and keep the converted copy out of the theme (it is
# in the MOCA at website/uploads/redirects.yaml).

# ── Author-prefixed posts from old HubSpot/WordPress site ───────────
# Old site had /author-slug/post-slug/ paths. Ghost uses flat /{slug}/.
- from: ^/jake/(.*)$
  to: /$1
  permanent: true

- from: ^/matthewloftus/(.*)$
  to: /$1
  permanent: true

- from: ^/suzania/(.*)$
  to: /$1
  permanent: true

- from: ^/trivial/(.*)$
  to: /$1
  permanent: true

- from: ^/sacred-season/(.*)$
  to: /$1
  permanent: true

- from: ^/passages/(.*)$
  to: /$1
  permanent: true

# ── Category → Tag ──────────────────────────────────────────────────
# Old site used /category/name/, Ghost uses /tag/name/.
- from: ^/category/(.*)$
  to: /tag/$1
  permanent: true

# ── Author pages ────────────────────────────────────────────────────
# Ghost's default /author/{slug}/ URLs aren't used by this theme —
# guest authors live as tags, not Ghost users. Send any stragglers to
# the tag-style contributor page.
# ── Legacy HubSpot author slugs (SEO audit 2026-09-22, H2) ──────────
# The generic /author/{slug}/ rule below assumes the old slug matches an
# author- tag. For 76 slugs captured on the HubSpot site it does not, so
# those URLs 301'd into a 404. Every backlink to a contributor page from
# the old site landed there.
#
# These must stay ABOVE the generic rule: Ghost takes the first match.
#
# Each one ends (/.*)?$ rather than /?$ so a paginated old URL comes with
# it: /author/jmeador/page/2/ used to fall past these to the generic rule
# and land on /tag/author-jmeador/, which does not exist.
#
# Mapped by matching the old slug (initial + surname, e.g. jmeador) to
# the contributor's author- tag. `ianm` is the one inference: Ian Mosley
# is the only Ian M. in the tag list.
- from: ^/author/abertodatti(/.*)?$
  to: /tag/author-andrew-bertodatti/
  permanent: true
- from: ^/author/ahales(/.*)?$
  to: /tag/author-ashley-hales/
  permanent: true
