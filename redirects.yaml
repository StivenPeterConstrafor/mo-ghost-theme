# ── RSS / Feed ──────────────────────────────────────────────────────
# Old WordPress/HubSpot feed URLs → Ghost's built-in RSS.
- from: ^/feed/?$
  to: /rss/
  permanent: true

- from: ^/rss\.xml$
  to: /rss/
  permanent: true

- from: ^/atom\.xml$
  to: /rss/
  permanent: true

# ── WordPress legacy query params ───────────────────────────────────
# Old ?p=123 and ?page_id=123 URLs can't be matched by Ghost's regex
# redirects (no query-string matching). These will 404 naturally.
# Google Search Console can track and verify they drop off over time.

# ── Ebook vanity URLs ───────────────────────────────────────────────
- from: ^/family/?$
  to: /ebook/spiritual-formation-for-the-family/
  permanent: false

- from: ^/fracture/?$
  to: /ebook/navigating-the-fracture/
  permanent: false

- from: ^/ai/?$
  to: /ebook/ai-and-the-church/
  permanent: false

# ── Static assets ───────────────────────────────────────────────────
# /llms.txt — the llmstxt.org convention is a markdown manifest at
# the site root that AI crawlers (and humans) can read to find the
# canonical entry-points and key pages. Ghost(Pro) doesn't allow
# static files at the apex, so we host as a theme asset and redirect
# /llms.txt → /assets/llms.txt.
- from: ^/llms\.txt$
  to: /assets/llms.txt
  permanent: true

# ── The Faith Received: Browse became Curated (2026-09-24) ───────────
# Ian: "Change the URL of this page to /curated". Query strings and the
# #traditions fragment carry across.
- from: ^/the-faith-received/browse/?$
  to: /the-faith-received/curated/
  permanent: true
