name: TFR Changelog

# Posts a commit's "Changelog:" line to The Faith Received's public
# changelog (About page, Changelog tab). TFR only: the script skips any
# commit that touches no file matched by TFR_PATHS, so nothing about the
# rest of Mere Orthodoxy can reach the page. See
# scripts/tfr-changelog-post.mjs for the message format.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # History (without file contents) so the script can ask git
          # which files each pushed commit touched.
          fetch-depth: 100
          filter: blob:none
          sparse-checkout: scripts/tfr-changelog-post.mjs
          sparse-checkout-cone-mode: false
      - name: Post changelog lines for TFR commits
        env:
          CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
          REPO_TAG: theme
          TFR_PATHS: '^(custom-faith-|custom-the-faith-received|custom-admin-tfr|partials/faith-received/|assets/js/(faith-|port/|page/faith-|lib/faith-|admin-tfr)|assets/css/(faith-|port/)|assets/built/faith-|assets/data/faith-received/|docs/faith-received/|scripts/tfr-changelog|\.github/workflows/tfr-changelog)'
        run: node scripts/tfr-changelog-post.mjs
